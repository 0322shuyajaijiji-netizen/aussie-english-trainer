<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aussie English Trainer</title><style>
:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#17314b;background:#f4f8fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#113e66,#087f80);color:white;padding:22px 18px}header h1{margin:0;font-size:24px}header p{margin:5px 0 0;color:#e1f5f7}main{max-width:960px;margin:auto;padding:16px}.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}button,select,input{font:inherit}button{border:1px solid #b6c8d9;background:white;border-radius:11px;padding:10px 14px;cursor:pointer;color:#17314b}button.primary,.nav button.active{background:#086d83;color:white;border-color:#086d83}button:disabled{opacity:.5;cursor:not-allowed}button:hover:not(:disabled){filter:brightness(.95)}.panel{background:white;border:1px solid #d8e5ed;border-radius:17px;padding:18px;margin-bottom:15px;box-shadow:0 3px 12px #18354b0a}.muted{color:#587083}.small{font-size:13px}.tag{background:#e8f5f5;padding:4px 9px;border-radius:99px;font-size:12px}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.phrase{font-size:clamp(22px,4vw,32px);font-weight:750;margin:16px 0}.translation{font-size:18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.dialog{border-left:3px solid #9ec4d3;padding:8px 12px;margin:7px 0;background:#f5fafc}.dialog.mine{border-left-color:#10a48c;background:#eaf9f4}.score{font-size:30px;font-weight:750;color:#087b75}.progress{height:10px;background:#e5edf2;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#159d8a}.listitem{border-bottom:1px solid #edf1f5;padding:10px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}input,select{padding:10px;border-radius:9px;border:1px solid #b7cad8;max-width:100%}input[type=text]{width:100%}.hidden{display:none}.status{padding:10px;background:#f0f7fb;border-radius:10px;margin-top:12px;white-space:pre-wrap}.notice{background:#fff7e7;border:1px solid #f1d49e;border-radius:12px;padding:12px}footer{text-align:center;padding:20px;color:#657b8e;font-size:12px}@media(max-width:600px){.panel{padding:14px}button{padding:10px}header h1{font-size:21px}}
</style></head><body><header><div style="max-width:960px;margin:auto"><h1>🇦🇺 Aussie English Trainer</h1><p>Global Science Tour · Useful English Phrases</p></div></header><main><nav class="nav" id="nav"></nav><div id="app"></div></main><footer>教材に基づく無料・端末内学習アプリ · 音声機能はブラウザに依存します</footer><script src="phrases.js"></script><script>
const DATA=window.PHRASES||[];const STORE='aussie-english-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')}catch{};saved.done??={};saved.star??={};saved.attempts??={};let tab='home',idx=0,cat='すべて',showJa=true,rec=null,recordedUrl=null,recognition=null,voiceIndex=0,roleTurn=0,roleLog=[],roleScript=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(STORE,JSON.stringify(saved))}function categories(){return ['すべて',...new Set(DATA.map(x=>x.category))]}function current(){return DATA[idx]}function changeTab(t){tab=t;render()}function setIndex(n){idx=Math.max(0,Math.min(DATA.length-1,n));render()}function speak(t,rate=0.9){if(!('speechSynthesis'in window)){alert('このブラウザでは音声再生できません');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-AU';u.rate=rate;let voices=speechSynthesis.getVoices();let v=voices.find(v=>v.lang.toLowerCase()==='en-au')||voices.find(v=>v.lang.toLowerCase().startsWith('en-'));if(v)u.voice=v;speechSynthesis.speak(u)}function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}function accuracy(a,b){let x=norm(a).split(' ').filter(Boolean),y=norm(b).split(' ').filter(Boolean);let dp=Array.from({length:x.length+1},()=>Array(y.length+1).fill(0));for(let i=1;i<=x.length;i++)for(let j=1;j<=y.length;j++)dp[i][j]=x[i-1]===y[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);return Math.round(100*2*dp[x.length][y.length]/Math.max(1,x.length+y.length))}function recognitionStart(callback){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('status').textContent='このブラウザは音声認識に対応していません。下の入力欄から英文を入力して練習できます。';return}try{recognition?.abort();recognition=new SR();recognition.lang='en-AU';recognition.interimResults=false;recognition.onresult=e=>callback(e.results[0][0].transcript);recognition.onerror=e=>$('status').textContent='音声認識エラー: '+e.error+'。入力欄からも練習できます。';recognition.start();$('status').textContent='🎤 話してください…'}catch(e){$('status').textContent='マイクを開始できません: '+e.message}}
function nav(){let tabs=[['home','🏠 ホーム'],['learn','📚 フレーズ'],['quiz','✏️ 暗記'],['speak','🎤 発話'],['role','💬 会話'],['progress','📊 記録']];$('nav').innerHTML=tabs.map(([t,l])=>`<button class="${t===tab?'active':''}" onclick="changeTab('${t}')">${l}</button>`).join('')}
function render(){nav();let a=$('app');if(tab==='home'){let done=Object.keys(saved.done).filter(k=>saved.done[k]).length;a.innerHTML=`<section class="panel"><h2>Welcome to Australia! 🦘</h2><p>教材の全 <b>${DATA.length}</b> フレーズを収録。聞く・覚える・話す・会話するを繰り返そう。</p><p>学習済み：${done} / ${DATA.length}</p><div class="progress"><div style="width:${done/DATA.length*100}%"></div></div></section><div class="grid">${[['learn','📚','フレーズ学習','英文と日本語、会話例を学ぶ'],['quiz','✏️','暗記チャレンジ','日本語から英語を思い出す'],['speak','🎤','発話チェック','録音・聞き直し・英文照合'],['role','💬','会話練習','教材の会話を相手役と練習']].map(([t,ico,title,desc])=>`<section class="panel"><h2>${ico} ${title}</h2><p class="muted">${desc}</p><button class="primary" onclick="changeTab('${t}')">始める →</button></section>`).join('')}</div><div class="notice small">🔒 学習記録はこの端末のブラウザに保存します。録音は保存されません。音声認識が利用できる場合、ブラウザの提供元サービスで音声処理されることがあります。</div>`}
if(tab==='learn'){let p=current();a.innerHTML=`<section class="panel"><div class="flex"><select id="cat" onchange="selectCat(this.value)">${categories().map(c=>`<option ${c===cat?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="tag">No. ${p.id} / ${DATA.length}</span><span class="tag">${esc(p.category)}</span></div><div class="phrase">${esc(p.en)}</div><div class="translation" id="ja">${showJa?esc(p.ja):'（日本語訳を非表示）'}</div><div class="actions"><button onclick="speak(current().en)">🔊 聴く</button><button onclick="speak(current().en,.7)">🐢 ゆっくり</button><button onclick="showJa=!showJa;render()">訳を${showJa?'隠す':'表示'}</button><button onclick="toggleStar()">${saved.star[p.id]?'★ お気に入り':'☆ お気に入り'}</button><button class="${saved.done[p.id]?'primary':''}" onclick="toggleDone()">${saved.done[p.id]?'✓ 学習済み':'□ 覚えた'}</button></div><h3>教材の会話例</h3>${p.dialogue.map(d=>`<div class="dialog"><b>${esc(d.role)}:</b> ${esc(d.text)} <button class="small" onclick="speak(${JSON.stringify(d.text).replace(/"/g,'&quot;')})">🔊</button></div>`).join('')}<div class="actions"><button onclick="move(-1)">← 前へ</button><button class="primary" onclick="move(1)">次へ →</button><button onclick="changeTab('speak')">このフレーズを話す 🎤</button></div></section>`}
if(tab==='quiz'){let p=current();a.innerHTML=`<section class="panel"><span class="tag">No. ${p.id} · ${esc(p.category)}</span><h2>日本語を英語にしよう</h2><p class="phrase">${esc(p.ja)}</p><input id="quizAnswer" type="text" placeholder="英語で入力（または声に出してから確認）"><div class="actions"><button onclick="quizCheck()" class="primary">答え合わせ</button><button onclick="speak(current().en)">🔊 模範音声</button><button onclick="move(1)">次の問題 →</button></div><div id="status" class="status">入力しなくても答え合わせできます。</div></section>`}
if(tab==='speak'){let p=current();a.innerHTML=`<section class="panel"><span class="tag">No. ${p.id} · ${esc(p.category)}</span><h2>発話チェック</h2><p class="phrase">${esc(p.en)}</p><p>${esc(p.ja)}</p><div class="actions"><button onclick="speak(current().en)">🔊 お手本</button><button onclick="speak(current().en,.7)">🐢 ゆっくり</button><button class="primary" onclick="recognitionStart(checkSpeech)">🎙 音声認識</button><button onclick="recordStart()">⏺ 録音開始</button><button onclick="recordStop()">⏹ 録音終了</button></div><div id="playback"></div><label class="small muted">認識できない場合は入力して確認</label><input type="text" id="typed" placeholder="聞き取られた英文を入力"><button onclick="checkSpeech($('typed').value)">英文を照合</button><div id="status" class="status">音声認識の結果は発音の点数ではありません。録音を聞き直して、お手本と比べましょう。</div><div class="actions"><button onclick="move(-1)">← 前へ</button><button onclick="move(1)">次へ →</button></div></section>`}
if(tab==='role')renderRole();if(tab==='progress'){let done=DATA.filter(p=>saved.done[p.id]);let starred=DATA.filter(p=>saved.star[p.id]);a.innerHTML=`<section class="panel"><h2>学習記録</h2><p>学習済み：<b>${done.length} / ${DATA.length}</b>　お気に入り：<b>${starred.length}</b></p><div class="progress"><div style="width:${done.length/DATA.length*100}%"></div></div><h3>カテゴリー別</h3>${categories().slice(1).map(c=>{let ar=DATA.filter(p=>p.category===c),n=ar.filter(p=>saved.done[p.id]).length;return `<div class="listitem"><span>${esc(c)}</span><span>${n}/${ar.length}</span></div>`}).join('')}<h3>お気に入り</h3>${starred.length?starred.map(p=>`<div class="listitem"><span>${esc(p.en)}</span><button onclick="setIndex(${p.id-1});changeTab('learn')">学習</button></div>`).join(''):'まだ登録されていません'}<h3>バックアップ</h3><div class="actions"><button onclick="exportData()">記録をJSONで保存</button><button onclick="$('import').click()">記録を読み込む</button><input id="import" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div><div class="notice small">ブラウザのデータを消すと記録も消えます。必要に応じてバックアップしてください。</div></section>`}}
function selectCat(c){cat=c;let i=DATA.findIndex(p=>c==='すべて'||p.category===c);if(i>=0)idx=i;render()}function move(n){let filtered=DATA.map((p,i)=>({p,i})).filter(({p})=>cat==='すべて'||p.category===cat);let at=filtered.findIndex(o=>o.i===idx);idx=filtered[(at+n+filtered.length)%filtered.length].i;render()}function toggleDone(){let id=current().id;saved.done[id]=!saved.done[id];save();render()}function toggleStar(){let id=current().id;saved.star[id]=!saved.star[id];save();render()}function quizCheck(){let p=current(),s=$('quizAnswer').value;let score=s.trim()?accuracy(s,p.en):null;$('status').innerHTML=`<b>解答例：</b>${esc(p.en)}<br>${score===null?'声に出して言えたか確認しましょう。':`文字列一致度：<b>${score}%</b>（言い換え表現は低く出る場合があります）`}`;saved.attempts[p.id]=(saved.attempts[p.id]||0)+1;save()}function checkSpeech(s){let score=accuracy(s,current().en);$('status').innerHTML=`<b>認識・入力された英文：</b> ${esc(s||'（認識なし）')}<br><b>お手本：</b> ${esc(current().en)}<br><span class="score">${score}%</span> <span class="small">単語一致度の目安（発音採点ではありません）</span>`;saved.attempts[current().id]=(saved.attempts[current().id]||0)+1;save()}
async function recordStart(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('status').textContent='録音非対応です。HTTPSで開き、マイク許可を確認してください。';return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true}),chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{if(recordedUrl)URL.revokeObjectURL(recordedUrl);recordedUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));$('playback').innerHTML='<p>自分の声を聞き直そう：</p><audio controls src="'+recordedUrl+'"></audio>';stream.getTracks().forEach(t=>t.stop())};rec.start();$('status').textContent='⏺ 録音中…「録音終了」を押してください。'}catch(e){$('status').textContent='録音できません: '+e.message}}function recordStop(){if(rec?.state==='recording'){rec.stop();$('status').textContent='録音が終わりました。お手本と聴き比べてみましょう。'}}
function renderRole(){let p=current();if(!roleScript||roleScript.id!==p.id){roleScript=p;roleTurn=0;roleLog=[]}let lines=p.dialogue;let shown=roleLog.map(l=>`<div class="dialog ${l.mine?'mine':''}"><b>${l.mine?'You':'Partner'}:</b> ${esc(l.text)} ${l.mine?'':`<button onclick="speak(${JSON.stringify(l.text).replace(/"/g,'&quot;')})">🔊</button>`}</div>`).join('');let next=lines[roleTurn];$('app').innerHTML=`<section class="panel"><h2>💬 教材ロールプレイ</h2><div class="flex"><span class="tag">No. ${p.id}</span><button onclick="move(-1)">←</button><button onclick="move(1)">→</button><button onclick="roleScript=null;render()">最初から</button></div><p class="muted">${esc(p.en)}　|　${esc(p.ja)}</p>${shown||'<p class="muted">会話を始めましょう。教材のAを相手役、Bを自分の役として練習します。</p>'}${next?`<div class="notice"><b>次の番：</b>${next.role==='A'?'相手（A）':'あなた（B）'}<br>${next.role==='B'?`<span class="small">ヒント：${esc(next.text)}</span>`:'相手のセリフを再生できます。'}</div><div class="actions">${next.role==='A'?`<button class="primary" onclick="roleAdvance()">🔊 相手のセリフを聞く</button>`:`<button class="primary" onclick="recognitionStart(roleSpeech)">🎙 自分のセリフを話す</button><button onclick="roleAdvance()">言えたので次へ</button>`}</div>`:'<div class="status">🎉 会話終了！ 別のフレーズにも挑戦しよう。</div>'}<div id="status" class="status">※教材にある会話を使う練習です。無制限の生成AI自由会話ではありません。</div></section>`}function roleAdvance(){let d=current().dialogue[roleTurn];if(!d)return;if(d.role==='A')speak(d.text);roleLog.push({text:d.text,mine:d.role==='B'});roleTurn++;renderRole()}function roleSpeech(s){let d=current().dialogue[roleTurn];if(!d)return;let score=accuracy(s,d.text);roleLog.push({text:s,mine:true});roleTurn++;renderRole();$('status').textContent=`認識結果の単語一致度：${score}%（発音点数ではありません）`}
function exportData(){let blob=new Blob([JSON.stringify(saved,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='aussie-learning-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){try{let j=JSON.parse(await e.target.files[0].text());if(!j.done||!j.star)throw Error('形式が違います');saved=j;save();render()}catch(e){alert('読み込みに失敗しました: '+e.message)}}
if(!DATA.length)$('app').textContent='教材データが読み込めません。index.html と phrases.js を同じフォルダに置いてください。';else render();
</script></body></html>
